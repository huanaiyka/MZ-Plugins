<!DOCTYPE html>
<!--
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  哎呀，你居然偷偷看了别人的信封，
  真是个小淘气鬼 (｡•̀ᴗ-)✧ 嘘，不要说出来哦。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乱世信箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f7f4ef;
    color: #3a3a3a;
    min-height: 100vh;
  }

  /* ===== 密码锁页面 ===== */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: #f7f4ef;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 200;
  }

  .lock-box {
    text-align: center;
    width: 100%;
    max-width: 360px;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .lock-illustration {
    width: 140px;
    height: auto;
    margin: 0 auto 20px;
    display: block;
    filter: drop-shadow(0 8px 16px rgba(140, 120, 90, 0.15));
  }

  .lock-box h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #5a4a3a;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .lock-box .sub {
    font-size: 0.85rem;
    color: #a89a88;
    margin-bottom: 28px;
  }

  .lock-box input {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.3rem;
    text-align: center;
    letter-spacing: 6px;
    border: 2px solid #e8e0d4;
    border-radius: 10px;
    background: #fffdf9;
    outline: none;
    transition: border-color 0.2s;
    color: #5a4a3a;
  }

  .lock-box input:focus { border-color: #c9a86a; }

  .lock-error {
    color: #c0563e;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
  }

  .lock-box button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: #c9a86a;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }

  .lock-box button:hover { background: #b8975a; }

  /* ===== 角落的小按钮 ===== */
  .about-btn {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #e8e0d4;
    background: #fffdf9;
    color: #b3a693;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(140, 120, 90, 0.1);
    transition: all 0.2s;
    z-index: 210;
    font-family: inherit;
  }

  .about-btn:hover {
    background: #f0ebe2;
    color: #8a7a68;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(140, 120, 90, 0.18);
  }

  /* ===== 作者信息弹窗 ===== */
  .about-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 50, 40, 0.35);
    backdrop-filter: blur(3px);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 300;
  }

  .about-overlay.active { display: flex; }

  .about-card {
    background: #fffdf9;
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 20px 50px rgba(80, 60, 40, 0.25);
    animation: pop 0.22s ease;
    text-align: center;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .about-card h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #5a4a3a;
    margin-bottom: 16px;
  }

  .about-card .about-text {
    font-size: 0.9rem;
    line-height: 1.9;
    color: #8a7a68;
    white-space: pre-wrap;
  }

  .about-card .about-close {
    margin-top: 24px;
    width: 100%;
    padding: 11px;
    background: #f0ebe2;
    color: #8a7a68;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }

  .about-card .about-close:hover { background: #e8e0d4; }

  /* ===== 信件内容页 ===== */
  #letterView {
    display: none;
    padding: 48px 20px;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    animation: fadeUp 0.5s ease;
  }

  #letterView.show { display: flex; }

  .letter-paper {
    background: #fffdf9;
    border: 1px solid #e8e0d4;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 8px 30px rgba(140, 120, 90, 0.1);
  }

  .letter-paper h2 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #5a4a3a;
    margin-bottom: 6px;
  }

  .letter-date {
    font-size: 0.8rem;
    color: #b3a693;
    margin-bottom: 24px;
  }

  .letter-content {
    line-height: 2;
    color: #4a3f33;
    font-size: 0.98rem;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .letter-content .signature {
    margin-top: 28px;
    text-align: right;
    color: #a89a88;
    font-size: 0.9rem;
  }

  .back-btn {
    margin-top: 28px;
    width: 100%;
    max-width: 560px;
    padding: 12px;
    background: #f0ebe2;
    color: #8a7a68;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }

  .back-btn:hover { background: #e8e0d4; }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: #c4b8a8;
  }
</style>
</head>
<body>

<!-- ===== 密码锁页面 ===== -->
<div id="lockScreen">
  <div class="lock-box">
    <svg class="lock-illustration" viewBox="0 0 140 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="28" width="120" height="74" rx="6" fill="#fffdf9" stroke="#c9a86a" stroke-width="2.5"/>
      <path d="M10 34 L70 74 L130 34" stroke="#c9a86a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>乱世信箱</h1>
    <p class="sub">输入密码，打开属于你的那封信</p>
    <input type="password" id="passwordInput" inputmode="numeric" placeholder="····" autocomplete="off">
    <div class="lock-error" id="lockError"></div>
    <button onclick="tryUnlock()">打开信件</button>
  </div>
</div>

<!-- ===== 角落的作者按钮 ===== -->
<button class="about-btn" onclick="openAbout()" title="关于作者">✉</button>

<!-- ===== 作者信息弹窗 ===== -->
<div class="about-overlay" id="aboutOverlay">
  <div class="about-card">
    <h3>关于这个信箱</h3>
    <div class="about-text" id="aboutText"></div>
    <button class="about-close" onclick="closeAbout()">合上信纸</button>
  </div>
</div>

<!-- ===== 信件内容页 ===== -->
<div id="letterView">
  <div class="letter-paper">
    <h2 id="letterTitle"></h2>
    <div class="letter-date" id="letterDate"></div>
    <div class="letter-content" id="letterBody"></div>
  </div>
  <button class="back-btn" onclick="goBack()">合上信纸</button>
  <footer></footer>
</div>

<script>
/* ============================================================
  因技术力有限，无法防止邮箱被拆。
  还请能看到这行字的你保守秘密呀(´･ω･`)
   ============================================================ */

/* ============================================================
   ▼▼▼ 需要修改的地方 ①：作者信息 ▼▼▼
   \n 表示换行，可以随意增删行。
   ============================================================ */
const ABOUT_TEXT = "————————————\n[宝可梦+信长的野望RPG]\n\n这里是与二次创作游戏\n的世界连结的信箱。\n\n不要忘记心中的热爱。\n感谢你来到这里。\n————————————\n网页的创意与作成：幻爱\n huanaiyka@outlook.com";
/* ============================================================
   ▲▲▲ 修改到此为止 ▲▲▲
   ============================================================ */


/* ============================================================
   ▼▼▼ 需要修改的地方 ②：信件列表 ▼▼▼
   每封信的 password 就是打开它的密码。
   ============================================================ */
const letters = [
  {
    id: 1,
    title: "给未来的自己（临时模板）",
    date: "2024 · 春",
    password: "2024",
    content: "亲爱的自己：\n\n当你打开这封信的时候，不知道已经过去了多久。\n\n希望你还记得那个春天的下午，阳光很好，你坐在窗边，心里有些迷茫，但依然愿意相信未来。\n\n无论你现在过得怎样，都请记得：你曾经那么努力地想要好好生活。",
    signature: "—— 过去的你"
  },
  {
    id: 2,
    title: "一封没有寄出的信（临时模板）",
    date: "2023 · 冬",
    password: "1111",
    content: "有些话，当时没说出口，后来也就再也说不出口了。\n\n这封信写给我曾经很在乎的一个人。谢谢你出现在我的生命里，哪怕只是短暂的一段。\n\n愿你一切都好。",
    signature: "—— 一个念旧的人"
  },
  {
    id: 3,
    title: "藏在心底的小秘密（临时模板）",
    date: "2024 · 夏",
    password: "0520",
    content: "其实我一直有一个小小的梦想，从来没跟别人说过。\n\n我想去一个很远的地方，住上一段时间，每天看日出日落，写一些没人看的文字。\n\n也许有一天，我会真的出发。",
    signature: "—— 做梦的人"
  }
];
/* ============================================================
   ▲▲▲ 修改到此为止 ▲▲▲
   ============================================================ */


// ===== 以下逻辑一般不需要改动 =====

const lockScreen = document.getElementById('lockScreen');
const letterView = document.getElementById('letterView');
const passwordInput = document.getElementById('passwordInput');
const lockError = document.getElementById('lockError');
const aboutOverlay = document.getElementById('aboutOverlay');

// ---- 作者信息弹窗 ----
function openAbout() {
  document.getElementById('aboutText').textContent = ABOUT_TEXT;
  aboutOverlay.classList.add('active');
}

function closeAbout() {
  aboutOverlay.classList.remove('active');
}

aboutOverlay.addEventListener('click', e => {
  if (e.target === aboutOverlay) closeAbout();
});

// ---- 密码验证 ----
function tryUnlock() {
  const input = passwordInput.value.trim();
  if (!input) {
    lockError.textContent = '';
    return;
  }

  const matched = letters.find(l => l.password === input);

  if (matched) {
    lockError.textContent = '';
    openLetter(matched);
  } else {
    lockError.textContent = '';
    passwordInput.value = '';
    passwordInput.focus();
  }
}

function openLetter(letter) {
  document.getElementById('letterTitle').textContent = letter.title;
  document.getElementById('letterDate').textContent = letter.date;

  const body = document.getElementById('letterBody');
  let html = escapeHtml(letter.content).replace(/\n/g, '<br>');
  if (letter.signature) {
    html += `<div class="signature">${escapeHtml(letter.signature)}</div>`;
  }
  body.innerHTML = html;

  lockScreen.style.display = 'none';
  letterView.classList.add('show');
  window.scrollTo(0, 0);
}

function goBack() {
  letterView.classList.remove('show');
  lockScreen.style.display = 'flex';
  passwordInput.value = '';
  lockError.textContent = '';
  passwordInput.focus();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

passwordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') tryUnlock();
});

passwordInput.focus();

/* ============================================================
   ▼▼▼ 禁用右键与常用快捷键 ▼▼▼
   注意：只防普通访客，不能真正保护源码。
   ============================================================ */

// 禁用右键菜单
document.addEventListener('contextmenu', function (e) {
  e.preventDefault();
});

// 禁用常见快捷键
document.addEventListener('keydown', function (e) {
  const key = e.key.toLowerCase();

  // F12
  if (e.key === 'F12') {
    e.preventDefault();
    return;
  }

  // Ctrl+Shift+I / J / C
  if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(key)) {
    e.preventDefault();
    return;
  }

  // Ctrl+U（查看源代码）
  if (e.ctrlKey && key === 'u') {
    e.preventDefault();
    return;
  }

  // Ctrl+S（保存网页）
  if (e.ctrlKey && key === 's') {
    e.preventDefault();
    return;
  }

  // Ctrl+A（全选）
  if (e.ctrlKey && key === 'a') {
    e.preventDefault();
    return;
  }
});

// 禁用拖拽选中（输入框除外）
document.addEventListener('selectstart', function (e) {
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault();
  }
});
</script>
</body>
</html>
