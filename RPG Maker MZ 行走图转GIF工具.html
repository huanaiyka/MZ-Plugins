<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RPG Maker行走图转GIF - 一键批量 | 点击即下载</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2b2b2b;
            color: #eee;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: #3c3c3c;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #ffd966;
        }
        h2 { font-size: 1.3rem; border-left: 4px solid #ffaa44; padding-left: 12px; margin: 15px 0 10px 0; }
        h3 {
            margin-top: 0;
            border-left: 4px solid #ffaa44;
            padding-left: 12px;
            font-size: 1.2rem;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: stretch;
        }
        .panel {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 18px;
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }
        .single-drop-zone {
            transition: border-color 0.1s ease;
            border: 2px solid transparent;
            border-radius: 16px;
        }
        .single-drop-zone.drag-over {
            border-color: #ffaa44;
            background: #3a3a3a;
            box-shadow: 0 0 0 1px #ffaa44 inset;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        input, select, button {
            background: #1e1e1e;
            border: 1px solid #5a5a5a;
            color: #eee;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 100%;
        }
        button {
            background: #ffaa44;
            color: #2b2b2b;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            margin-top: 12px;
        }
        button:hover {
            background: #ffcc66;
            transform: scale(1.02);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .checkbox-group input {
            width: auto;
            margin: 0;
        }
        .preview-area {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            margin-top: 20px;
        }
        canvas {
            background: #4a4a4a;
            box-shadow: 0 0 0 2px #666;
            border-radius: 8px;
            margin: 8px auto;
            display: block;
            max-width: 100%;
        }
        .status {
            background: #00000080;
            border-radius: 12px;
            padding: 6px;
            text-align: center;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .download-btn {
            background: #2c7da0;
            color: white;
        }
        .flex-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .param-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .double-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .role-grid {
            display: grid;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .role-cell {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            border: 2px solid #5a5a5a;
        }
        .role-cell.selected {
            background: #ffaa44;
            border-color: white;
            color: #1e1e1e;
        }
        .batch-area {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 18px;
            margin-top: 20px;
            transition: border-color 0.1s ease;
            border: 2px solid transparent;
        }
        .batch-area.drag-over {
            border-color: #61a0af;
            background: #2f4a4a;
            box-shadow: 0 0 0 1px #61a0af inset;
        }
        .file-list {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.8rem;
            margin: 10px 0;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #4a4a4a;
            gap: 8px;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-name {
            word-break: break-all;
            flex: 1;
        }
        .remove-file-btn {
            background: #9b4a4a;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            width: auto;
            margin: 0;
        }
        .remove-file-btn:hover {
            background: #c55a5a;
            transform: none;
        }
        .clear-all-btn {
            background: #6c5a6a;
            margin-left: 8px;
            width: auto;
            padding: 4px 12px;
        }
        .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-bar {
            background: #3c3c3c;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            background: #61a0af;
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        hr {
            margin: 12px 0;
            border-color: #5a5a5a;
        }
        .badge {
            background: #ffaa44;
            color: #2b2b2b;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
        }
        .closable-notice {
            background: #3a2a1f;
            border-left: 4px solid #ffaa44;
            padding: 8px 30px 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin: 10px 0;
            color: #ffdd99;
            position: relative;
            display: none;
        }
        .closable-notice .close-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ffdd99;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            margin: 0;
            width: 24px;
            height: 24px;
            line-height: 1;
            font-weight: bold;
        }
        .closable-notice .close-btn:hover {
            color: white;
            background: none;
            transform: translateY(-50%) scale(1.1);
        }
        .dir-buttons {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .dir-btn {
            flex: 1;
            background: #1e1e1e;
            border: 2px solid #5a5a5a;
            color: #eee;
            font-size: 1rem;
            padding: 6px 0;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: none;
            margin-top: 0;
        }
        .dir-btn.active {
            background: #ffaa44;
            border-color: white;
            color: #2b2b2b;
        }
        .dir-btn:hover {
            background: #1e1e1e;
            border-color: #5a5a5a;
            color: #eee;
            transform: none;
        }
        .dir-btn.active:hover {
            background: #ffaa44;
            border-color: white;
            color: #2b2b2b;
        }
.batch-action-buttons {
    display: flex;
    flex-direction: column;   /* 改为垂直排列 */
    gap: 8px;                /* 上下间距可自行调整 */
    margin: 12px 0;
}
.batch-action-buttons button {
    width: 100%;             /* 按钮宽度占满父容器 */
    margin-top: 0;
    background: #2c7da0;
}
        .batch-action-buttons button.zip-mode {
            background: #9b59b6;
        }
        .batch-action-buttons button.single-mode {
            background: #5a6e7a;
        }
        .drag-tip {
            font-size: 0.7rem;
            color: #ffaa88;
            margin-top: 8px;
            text-align: center;
            border: 1px dashed #ffaa44;
            border-radius: 12px;
            padding: 5px;
            background: #2a2a2a;
        }
        .single-drag-tip {
            font-size: 0.7rem;
            color: #aaffdd;
            background: #2a3a2a;
            border-radius: 12px;
            padding: 5px;
            text-align: center;
            margin-top: 8px;
        }
/* 应用按钮线框样式 + 禁用悬停效果 */
#applyOffsetBtn {
    background: transparent !important;
    border: 1px solid #ffaa44 !important;
    color: #ffaa44 !important;
}
/* 彻底去除悬停效果：背景不变、不缩放、无其他变化 */
#applyOffsetBtn:hover {
    background: transparent !important;
    transform: none !important;
    border-color: #ffaa44 !important;
    color: #ffaa44 !important;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🎞️ RPG Maker行走图 → GIF动画<br><span style="font-size:0.8rem;"></span></h1>

    <!-- 单文件精细控制区 -->
    <div class="flex-row">
        <div class="panel single-drop-zone" id="singleDropZone">
            <h3>📂 上传文件</h3>
            <input type="file" id="uploadFile" accept="image/png,image/jpeg,image/webp">
            <div class="checkbox-group">
                <input type="checkbox" id="autoDetect" checked>
                <label style="margin:0">自动识别 ($开头 → 3x4 , 其他 → 12x8)</label>
            </div>
            <label>🔧 手动覆盖 (关闭自动识别时生效)</label>
            <div class="double-input-row">
                <input type="number" id="cols" placeholder="列数" value="12" step="1" min="1">
                <input type="number" id="rows" placeholder="行数" value="8" step="1" min="1">
            </div>
            <label>📐 单帧尺寸 (宽 x 高)</label>
            <div class="double-input-row">
                <input type="number" id="frameW" placeholder="宽" value="48" step="1">
                <input type="number" id="frameH" placeholder="高" value="48" step="1">
            </div>
            <div class="param-row">
                <label>🧩 每个角色占列数</label>
                <input type="number" id="colsPerRole" value="3" step="1" min="1">
            </div>
            <div class="param-row">
                <label>🧩 每个角色占行数</label>
                <input type="number" id="rowsPerRole" value="4" step="1" min="1">
            </div>
            <div class="role-panel-inner">
                <h3>🎯 选择角色 </h3>
                <div id="roleGridContainer" style="overflow-x: auto; min-height: 100px; text-align: center;">
                    <p style="color: #aaa;">上传图片后自动显示网格</p>
                </div>
                <div class="param-row" style="margin-top: 8px;">
                    <label>📌 偏移 (列, 行):</label>
                    <input type="number" id="roleColOffset" value="0" step="1" min="0" style="width: 70px;">
                    <input type="number" id="roleRowOffset" value="0" step="1" min="0" style="width: 70px;">
                    <button id="applyOffsetBtn" style="width: auto; margin-top: 0;">应用</button>
                </div>
            </div>
            
            <div class="btn-group">
                <button id="exportAllRolesZipBtn" style="background:#9b59b6;">📦 打包下载所有角色GIF</button>
                <button id="exportAllRolesSingleBtn" style="background:#5a6e7a;">🎞️ 逐个下载所有角色GIF</button>
            </div>
            <div id="zipNotice" class="closable-notice" style="display: none;">
                💡 <strong>ZIP文件被Windows阻止怎么办？</strong> 右键点击下载的ZIP文件 → 属性 → 在“常规”选项卡勾选“解除锁定” → 确定。("下载当前角色GIF"或"逐个下载"无此问题)
                <button class="close-btn" id="closeNoticeBtn">✖</button>
            </div>
        </div>

        <div class="panel">
            <div class="right-panel-content">
                <h3>🧭 方向 & 帧选择</h3>
                <div class="dir-buttons" id="dirButtons">
                    <button data-dir="down" class="dir-btn active">▼ 下</button>
                    <button data-dir="left" class="dir-btn">◀ 左</button>
                    <button data-dir="up" class="dir-btn">▲ 上</button>
                    <button data-dir="right" class="dir-btn">▶ 右</button>
                </div>
                <label>🎨 每方向帧索引 (如果只输入"1"，并选择上方全部方向，可制作转向GIF)</label>
                <input type="text" id="frameIndices" value="0,1,2,1" placeholder="0,1,2,1">
                <div class="gif-params" style="display:flex; gap:10px; margin:12px 0;">
                    <div><label>🎬 帧延迟 (ms)</label><input type="number" id="delay" value="240" step="10"></div>
                    <div><label>🔄 循环次数（默认无限循环）</label><input type="number" id="repeat" value="0" step="1" min="0"></div>
                    <div><label>⚙️ 质量 (默认无损格式)</label><input type="number" id="quality" value="1" step="1" min="1" max="30"></div>
                </div>
                <div class="flex-buttons">
                    <button id="previewBtn">▶️ 预览动画</button>
                    <button id="stopPreviewBtn">⏹️ 停止预览</button>
                </div>
                <button id="generateAndDownloadBtn" class="download-btn" style="background:#61a0af;">⬇️ 下载当前角色GIF</button>
                <div class="preview-area">
                    <h3>🖼️ 预览 / 结果</h3>
                    <canvas id="previewCanvas" width="200" height="200" style="width:auto; height:auto; max-width:100%"></canvas>
                    <div id="statusMsg" class="status">就绪。批量区点击按钮直接处理，无需额外“开始”。</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量上传 + 批量导出区（点击按钮直接执行） -->
    <div class="batch-area" id="batchDropZone">
        <h2>📦 批量处理 </h2>
        <div style="display:flex; flex-wrap:wrap; gap:15px; align-items:flex-end;">
            <div style="flex:2">
                <label>📎 选择多个行走图</label>
                <input type="file" id="batchUploadInput" multiple accept="image/png,image/jpeg,image/webp">
            </div>
            <div style="flex:1">
                <div class="batch-action-buttons">
                    <button id="batchZipDirectBtn" class="zip-mode">📦 打包下载</button>
                    <button id="batchSingleDirectBtn" class="single-mode">🎞️ 逐个下载</button>
                </div>
            </div>
        </div>
        
        <div class="batch-header">
            <span style="font-size:0.85rem;">📄 待处理文件列表 (<span id="batchFileCount">0</span> 个)</span>
            <button id="clearAllFilesBtn" class="clear-all-btn" style="background:#6c5a6a;">🗑️ 清空所有</button>
        </div>
        <div id="batchFileList" class="file-list">
            <div style="color:#aaa; text-align:center;">暂无文件，请选择或拖拽图片到本区域</div>
        </div>
        <div id="batchProgressArea" style="display:none;">
            <div class="progress-bar"><div id="batchProgressFill" class="progress-fill"></div></div>
            <div id="batchStatusText" class="status">批量处理中...</div>
        </div>
    </div>
</div>

<script>
    // ---------- DOM 元素 ----------
    const fileInput = document.getElementById('uploadFile');
    const autoDetectCheck = document.getElementById('autoDetect');
    const colsInput = document.getElementById('cols');
    const rowsInput = document.getElementById('rows');
    const frameWInput = document.getElementById('frameW');
    const frameHInput = document.getElementById('frameH');
    const colsPerRoleInput = document.getElementById('colsPerRole');
    const rowsPerRoleInput = document.getElementById('rowsPerRole');
    const delayInput = document.getElementById('delay');
    const repeatInput = document.getElementById('repeat');
    const qualityInput = document.getElementById('quality');
    const frameIndicesInput = document.getElementById('frameIndices');
    const previewBtn = document.getElementById('previewBtn');
    const stopPreviewBtn = document.getElementById('stopPreviewBtn');
    const generateAndDownloadBtn = document.getElementById('generateAndDownloadBtn');
    const previewCanvas = document.getElementById('previewCanvas');
    const statusDiv = document.getElementById('statusMsg');
    const roleColOffsetInput = document.getElementById('roleColOffset');
    const roleRowOffsetInput = document.getElementById('roleRowOffset');
    const applyOffsetBtn = document.getElementById('applyOffsetBtn');
    const roleGridContainer = document.getElementById('roleGridContainer');
    const exportAllRolesZipBtn = document.getElementById('exportAllRolesZipBtn');
    const exportAllRolesSingleBtn = document.getElementById('exportAllRolesSingleBtn');
    const closeNoticeBtn = document.getElementById('closeNoticeBtn');
    const zipNotice = document.getElementById('zipNotice');
    
    const batchUploadInput = document.getElementById('batchUploadInput');
    const batchZipDirectBtn = document.getElementById('batchZipDirectBtn');
    const batchSingleDirectBtn = document.getElementById('batchSingleDirectBtn');
    const batchFileListDiv = document.getElementById('batchFileList');
    const batchProgressArea = document.getElementById('batchProgressArea');
    const batchProgressFill = document.getElementById('batchProgressFill');
    const batchStatusText = document.getElementById('batchStatusText');
    const clearAllFilesBtn = document.getElementById('clearAllFilesBtn');
    const batchFileCountSpan = document.getElementById('batchFileCount');
    
    // 拖拽区域
    const singleDropZone = document.getElementById('singleDropZone');
    const batchDropZone = document.getElementById('batchDropZone');
    
    // 方向按钮映射
    const dirButtons = document.querySelectorAll('.dir-btn');
    const dirMap = { down: 0, left: 1, up: 3, right: 2 };
    let activeDirs = { down: true, left: false, up: false, right: false };

    let originalImage = null;
    let previewInterval = null;
    let currentFileName = "walk";
    let gifWorkerUrl = null;
    
    // ----- 批量文件管理 (追加模式) -----
    let batchFiles = [];

    function isFileDuplicate(newFile, existingFiles) {
        return existingFiles.some(f => f.name === newFile.name && f.size === newFile.size && f.lastModified === newFile.lastModified);
    }

    function addFilesToBatch(files) {
        let addedCount = 0;
        for (const file of files) {
            if (!file.type.startsWith('image/')) {
                setStatus(`跳过非图片: ${file.name}`, true);
                continue;
            }
            if (!isFileDuplicate(file, batchFiles)) {
                batchFiles.push(file);
                addedCount++;
            } else {
                setStatus(`已存在相同文件: ${file.name}，未重复添加`, false);
            }
        }
        if (addedCount > 0) {
            renderBatchFileList();
            setStatus(`✅ 批量区已添加 ${addedCount} 个新文件，共 ${batchFiles.length} 个`, false);
        } else if (files.length > 0) {
            setStatus(`所有文件均已存在列表中，未重复添加`, false);
        }
    }

    function removeFileAtIndex(index) {
        if (index >= 0 && index < batchFiles.length) {
            const removed = batchFiles.splice(index, 1);
            renderBatchFileList();
            setStatus(`已移除: ${removed[0].name}`, false);
        }
    }

    function clearAllFiles() {
        if (batchFiles.length > 0) {
            batchFiles = [];
            renderBatchFileList();
            setStatus(`已清空所有批量文件`, false);
        }
    }

    function renderBatchFileList() {
        batchFileCountSpan.innerText = batchFiles.length;
        if (batchFiles.length === 0) {
            batchFileListDiv.innerHTML = '<div style="color:#aaa; text-align:center;">暂无文件，请选择或拖拽图片到本区域</div>';
            return;
        }
        let html = '';
        batchFiles.forEach((file, idx) => {
            const sizeKB = (file.size / 1024).toFixed(1);
            html += `
                <div class="file-item">
                    <span class="file-name">📄 ${escapeHtml(file.name)} (${sizeKB} KB)</span>
                    <button class="remove-file-btn" data-index="${idx}">移除</button>
                </div>
            `;
        });
        batchFileListDiv.innerHTML = html;
        document.querySelectorAll('.remove-file-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.index, 10);
                if (!isNaN(idx)) removeFileAtIndex(idx);
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 获取用户当前选中的【基础方向行索引】（不包含角色偏移）
    function getBaseSelectedRows() {
        const order = ['down', 'left', 'up', 'right'];
        const baseRows = [];
        for (const dir of order) {
            if (activeDirs[dir]) {
                baseRows.push(dirMap[dir]);
            }
        }
        return baseRows;
    }

    // 单文件拖拽处理 (只取第一张图片)
    async function handleSingleImageDrop(files) {
        if (!files || files.length === 0) return;
        const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (imageFiles.length === 0) {
            setStatus('拖拽内容无有效图片', true);
            return;
        }
        const firstFile = imageFiles[0];
        setStatus(`单图区: 加载 ${firstFile.name} ...`);
        try {
            const img = await loadImageFromFile(firstFile);
            originalImage = img;
            currentFileName = firstFile.name;
            if (autoDetectCheck.checked) {
                const { cols, rows, colsPerRole, rowsPerRole } = detectGridFromFilename(firstFile.name);
                colsInput.value = cols;
                rowsInput.value = rows;
                colsPerRoleInput.value = colsPerRole;
                rowsPerRoleInput.value = rowsPerRole;
                if (firstFile.name.startsWith('$')) { frameWInput.value = 96; frameHInput.value = 96; }
                else { frameWInput.value = 48; frameHInput.value = 48; }
                setStatus(`自动识别: ${cols}x${rows} 网格`);
            }
            stopPreview();
            roleColOffsetInput.value = 0;
            roleRowOffsetInput.value = 0;
            await buildRoleGrid();
            const ctx = previewCanvas.getContext('2d');
            previewCanvas.width = Math.min(300, img.width);
            previewCanvas.height = previewCanvas.width * (img.height/img.width);
            ctx.drawImage(img, 0, 0, previewCanvas.width, previewCanvas.height);
            setStatus(`单图加载成功: ${img.width}x${img.height}`);
        } catch(err) {
            setStatus(`单图加载失败: ${err.message}`, true);
        }
    }

    function loadImageFromFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ---------- 核心功能函数 ----------
    async function getWorkerScriptUrl() {
        if (gifWorkerUrl) return gifWorkerUrl;
        try {
            const response = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
            if (!response.ok) throw new Error('worker fetch fail');
            const code = await response.text();
            const blob = new Blob([code], { type: 'application/javascript' });
            gifWorkerUrl = URL.createObjectURL(blob);
            return gifWorkerUrl;
        } catch(e) {
            console.error(e);
            throw new Error('无法加载gif.worker.js');
        }
    }

    function setStatus(msg, isError = false) {
        statusDiv.innerHTML = msg;
        statusDiv.style.color = isError ? '#ff8888' : '#aaffaa';
        console.log(msg);
    }

    function detectGridFromFilename(filename) {
        if (!filename) return { cols: 12, rows: 8, colsPerRole: 3, rowsPerRole: 4 };
        if (filename.startsWith('$')) return { cols: 3, rows: 4, colsPerRole: 3, rowsPerRole: 1 };
        return { cols: 12, rows: 8, colsPerRole: 3, rowsPerRole: 4 };
    }

    function parseFrameIndices(str) {
        return str.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n >= 0);
    }

    // 获取当前单张预览时使用的方向行（带当前角色偏移）
    function getSelectedRowsOrdered() {
        const baseRows = getBaseSelectedRows();
        const rowOffset = parseInt(roleRowOffsetInput.value, 10) || 0;
        const rowsPerRole = parseInt(rowsPerRoleInput.value, 10) || 4;
        return baseRows.map(r => r + rowOffset * rowsPerRole);
    }

    function getColOffset() {
        const colOffset = parseInt(roleColOffsetInput.value, 10) || 0;
        const colsPerRole = parseInt(colsPerRoleInput.value, 10) || 12;
        return colOffset * colsPerRole;
    }

    function extractFramesFromImage(img, cols, rows, frameW, frameH) {
        const frames = [];
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = frameW;
        canvas.height = frameH;
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const sx = col * frameW;
                const sy = row * frameH;
                if (sx + frameW <= img.width && sy + frameH <= img.height) {
                    ctx.clearRect(0, 0, frameW, frameH);
                    ctx.drawImage(img, sx, sy, frameW, frameH, 0, 0, frameW, frameH);
                    const frameCanvas = document.createElement('canvas');
                    frameCanvas.width = frameW;
                    frameCanvas.height = frameH;
                    frameCanvas.getContext('2d').drawImage(canvas, 0, 0);
                    frames.push({ canvas: frameCanvas, row, col });
                }
            }
        }
        return frames;
    }

    function buildAnimationSequence(allFrames, cols, selectedRows, frameIndices, colOffset) {
        const sequence = [];
        for (const rowIdx of selectedRows) {
            for (const frameIdx of frameIndices) {
                const targetCol = colOffset + frameIdx;
                const targetIndex = rowIdx * cols + targetCol;
                if (targetIndex >= 0 && targetIndex < allFrames.length) {
                    sequence.push(allFrames[targetIndex]);
                }
            }
        }
        return sequence;
    }

    function stopPreview() {
        if (previewInterval) { clearInterval(previewInterval); previewInterval = null; }
    }

    function startPreview() {
        if (!originalImage) { setStatus('请先上传行走图', true); return false; }
        stopPreview();
        let cols = parseInt(colsInput.value, 10);
        let rows = parseInt(rowsInput.value, 10);
        let frameW = parseInt(frameWInput.value, 10);
        let frameH = parseInt(frameHInput.value, 10);
        const delay = parseInt(delayInput.value, 10);
        if (isNaN(cols) || isNaN(rows) || isNaN(frameW) || isNaN(frameH)) { setStatus('参数无效', true); return false; }
        const allFrames = extractFramesFromImage(originalImage, cols, rows, frameW, frameH);
        if (allFrames.length === 0) { setStatus('没有切割到任何帧', true); return false; }
        const selectedRows = getSelectedRowsOrdered();
        if (selectedRows.length === 0) { setStatus('请至少选择一个方向', true); return false; }
        const frameIndices = parseFrameIndices(frameIndicesInput.value);
        if (frameIndices.length === 0) { setStatus('请指定有效的帧索引', true); return false; }
        const colOffset = getColOffset();
        const sequence = buildAnimationSequence(allFrames, cols, selectedRows, frameIndices, colOffset);
        if (sequence.length === 0) { setStatus('没有有效的动画帧', true); return false; }
        let idx = 0;
        previewCanvas.width = frameW;
        previewCanvas.height = frameH;
        const ctx = previewCanvas.getContext('2d');
        previewInterval = setInterval(() => {
            const frameObj = sequence[idx % sequence.length];
            ctx.clearRect(0, 0, frameW, frameH);
            ctx.drawImage(frameObj.canvas, 0, 0);
            idx++;
        }, delay);
        setStatus(`预览中 → 共 ${sequence.length} 帧`);
        return true;
    }

    // 通用GIF生成 (支持指定角色偏移)
    async function generateGifForRole(img, roleCol, roleRow, params) {
        const { cols, rows, frameW, frameH, colsPerRole, rowsPerRole, delay, repeat, quality, frameIndices, baseDirectionRows } = params;
        const colOffset = roleCol * colsPerRole;
        const rowOffset = roleRow * rowsPerRole;
        const allFrames = extractFramesFromImage(img, cols, rows, frameW, frameH);
        if (allFrames.length === 0) throw new Error('帧切割失败');
        const finalRows = baseDirectionRows.map(r => r + rowOffset);
        const sequence = buildAnimationSequence(allFrames, cols, finalRows, frameIndices, colOffset);
        if (sequence.length === 0) throw new Error('动画序列为空');
        const workerUrl = await getWorkerScriptUrl();
        return new Promise((resolve, reject) => {
            const gif = new GIF({ workers: 2, quality: quality, width: frameW, height: frameH, workerScript: workerUrl });
            for (let i = 0; i < sequence.length; i++) {
                gif.addFrame(sequence[i].canvas, { delay: delay, copy: true });
            }
            gif.on('finished', (blob) => resolve(blob));
            gif.on('error', (err) => reject(err));
            gif.render();
        });
    }

    function getAllRoleOffsets(cols, rows, colsPerRole, rowsPerRole) {
        const roleCols = Math.floor(cols / colsPerRole);
        const roleRows = Math.floor(rows / rowsPerRole);
        const offsets = [];
        for (let r = 0; r < roleRows; r++) {
            for (let c = 0; c < roleCols; c++) {
                offsets.push({ col: c, row: r });
            }
        }
        return offsets;
    }

    function getCurrentImageParamsForAll() {
        const cols = parseInt(colsInput.value, 10);
        const rows = parseInt(rowsInput.value, 10);
        const frameW = parseInt(frameWInput.value, 10);
        const frameH = parseInt(frameHInput.value, 10);
        const colsPerRole = parseInt(colsPerRoleInput.value, 10);
        const rowsPerRole = parseInt(rowsPerRoleInput.value, 10);
        const delay = parseInt(delayInput.value, 10);
        const repeat = parseInt(repeatInput.value, 10);
        const quality = parseInt(qualityInput.value, 10);
        const frameIndices = parseFrameIndices(frameIndicesInput.value);
        const baseDirectionRows = getBaseSelectedRows();  // 获取当前UI选择的方向（无角色偏移）
        return { cols, rows, frameW, frameH, colsPerRole, rowsPerRole, delay, repeat, quality, frameIndices, baseDirectionRows };
    }

    async function generateAndDownloadSingle() {
        if (!originalImage) { setStatus('请先上传行走图', true); return; }
        stopPreview();
        setStatus('生成当前角色GIF...');
        const params = getCurrentImageParamsForAll();
        const selectedRows = getSelectedRowsOrdered(); // 带偏移
        if (selectedRows.length === 0) { setStatus('请至少选择一个方向', true); return; }
        const frameIndices = parseFrameIndices(frameIndicesInput.value);
        if (frameIndices.length === 0) { setStatus('帧索引无效', true); return; }
        const colOff = getColOffset();
        const allFrames = extractFramesFromImage(originalImage, params.cols, params.rows, params.frameW, params.frameH);
        if (allFrames.length === 0) { setStatus('切割失败', true); return; }
        const sequence = buildAnimationSequence(allFrames, params.cols, selectedRows, frameIndices, colOff);
        if (sequence.length === 0) { setStatus('动画序列为空', true); return; }
        const workerUrl = await getWorkerScriptUrl();
        const gif = new GIF({ workers: 2, quality: params.quality, width: params.frameW, height: params.frameH, workerScript: workerUrl });
        for (let f of sequence) gif.addFrame(f.canvas, { delay: params.delay, copy: true });
        gif.on('finished', (blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentFileName.replace(/\.[^/.]+$/, '')}_角色_${roleColOffsetInput.value}_${roleRowOffsetInput.value}.gif`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus(`✅ 已下载 GIF`);
        });
        gif.render();
    }

    async function exportAllRolesAsZip() {
        if (!originalImage) { setStatus('请先上传行走图', true); return; }
        setStatus('⏳ 打包所有角色ZIP...');
        const params = getCurrentImageParamsForAll();
        const roleOffsets = getAllRoleOffsets(params.cols, params.rows, params.colsPerRole, params.rowsPerRole);
        if (roleOffsets.length === 0) { setStatus('没有完整角色', true); return; }
        const zip = new JSZip();
        const baseName = currentFileName.replace(/\.[^/.]+$/, '');
        let successCount = 0;
        for (let { col, row } of roleOffsets) {
            try {
                const blob = await generateGifForRole(originalImage, col, row, params);
                zip.file(`${baseName}_角色_${col}_${row}.gif`, blob);
                successCount++;
            } catch(e) { console.warn(e); }
        }
        if (successCount === 0) { setStatus('未生成任何角色', true); return; }
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${baseName}_全角色GIFs.zip`;
        a.click();
        URL.revokeObjectURL(url);
        setStatus(`✅ 已导出 ${successCount} 个角色GIF，打包ZIP下载完成。`);
        zipNotice.style.display = 'block';
    }

    async function exportAllRolesAsSingle() {
        if (!originalImage) { setStatus('请先上传行走图', true); return; }
        setStatus('逐个下载所有角色...');
        const params = getCurrentImageParamsForAll();
        const roleOffsets = getAllRoleOffsets(params.cols, params.rows, params.colsPerRole, params.rowsPerRole);
        const baseName = currentFileName.replace(/\.[^/.]+$/, '');
        let successCount = 0;
        for (let { col, row } of roleOffsets) {
            try {
                const blob = await generateGifForRole(originalImage, col, row, params);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${baseName}_角色_${col}_${row}.gif`;
                a.click();
                URL.revokeObjectURL(url);
                successCount++;
                await new Promise(r => setTimeout(r, 200));
            } catch(e) { console.warn(e); }
        }
        setStatus(`✅ 已触发 ${successCount} 次下载，如果部分被浏览器拦截，请允许此页面的多个下载权限。`);
    }

    // 批量处理核心 (直接调用，无额外开始按钮)
    async function batchProcess(mode) {
        if (batchFiles.length === 0) {
            alert('请先添加批量文件（选择或拖拽图片）');
            return;
        }
        // 禁用按钮防止重复点击
        batchZipDirectBtn.disabled = true;
        batchSingleDirectBtn.disabled = true;
        batchProgressArea.style.display = 'block';
        batchProgressFill.style.width = '0%';
        batchStatusText.innerText = '准备处理...';
        
        const totalFiles = batchFiles.length;
        const commonParams = getCurrentImageParamsForAll(); // 共用参数
        const frameIndices = commonParams.frameIndices;
        if (frameIndices.length === 0) {
            batchStatusText.innerText = '帧索引无效，请检查上方帧索引输入';
            batchProgressArea.style.display = 'none';
            batchZipDirectBtn.disabled = false;
            batchSingleDirectBtn.disabled = false;
            return;
        }
        
        let masterZip = null;
        if (mode === 'zip') masterZip = new JSZip();
        let totalRolesSuccess = 0;
        let anyFileProcessed = false;
        
        for (let fIdx = 0; fIdx < batchFiles.length; fIdx++) {
            const file = batchFiles[fIdx];
            batchStatusText.innerText = `处理文件 ${fIdx+1}/${totalFiles}: ${file.name}`;
            batchProgressFill.style.width = `${(fIdx / totalFiles) * 100}%`;
            try {
                const img = await loadImageFromFile(file);
                // 根据文件名自动识别网格和单帧尺寸
                const { cols, rows, colsPerRole, rowsPerRole } = detectGridFromFilename(file.name);
                let frameW = 48, frameH = 48;
                if (file.name.startsWith('$')) { frameW = 96; frameH = 96; }
                const roleOffsets = getAllRoleOffsets(cols, rows, colsPerRole, rowsPerRole);
                if (roleOffsets.length === 0) continue;
                const baseName = file.name.replace(/\.[^/.]+$/, '');
                let fileSuccess = 0;
                for (let { col, row } of roleOffsets) {
                    try {
                        const paramsForThis = {
                            cols, rows, frameW, frameH, colsPerRole, rowsPerRole,
                            delay: commonParams.delay,
                            repeat: commonParams.repeat,
                            quality: commonParams.quality,
                            frameIndices: commonParams.frameIndices,
                            baseDirectionRows: commonParams.baseDirectionRows
                        };
                        const blob = await generateGifForRole(img, col, row, paramsForThis);
                        const filename = `${baseName}_角色_${col}_${row}.gif`;
                        if (mode === 'zip') {
                            masterZip.file(filename, blob);
                        } else {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            a.click();
                            URL.revokeObjectURL(url);
                            await new Promise(r => setTimeout(r, 200));
                        }
                        totalRolesSuccess++;
                        fileSuccess++;
                        anyFileProcessed = true;
                    } catch(e) { console.warn(`${file.name} 角色(${col},${row})失败`, e); }
                }
                if (fileSuccess === 0) {
                    setStatus(`警告: ${file.name} 未生成任何GIF，请检查参数`, true);
                }
            } catch(err) {
                console.warn(`文件加载失败 ${file.name}`, err);
                setStatus(`文件 ${file.name} 加载失败: ${err.message}`, true);
            }
        }
        
        if (!anyFileProcessed) {
            batchStatusText.innerText = '错误: 没有成功生成任何GIF，请检查图片格式和参数';
            batchProgressArea.style.display = 'none';
            batchZipDirectBtn.disabled = false;
            batchSingleDirectBtn.disabled = false;
            return;
        }
        
        if (mode === 'zip' && masterZip) {
            batchStatusText.innerText = `打包ZIP中 (${totalRolesSuccess} 个GIF)...`;
            try {
                const finalZipBlob = await masterZip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(finalZipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `批量行走图_全角色_${Date.now()}.zip`;
                a.click();
                URL.revokeObjectURL(url);
                batchStatusText.innerText = `✅ 已导出 ${totalRolesSuccess} 个角色GIF，打包ZIP下载完成。`;
                zipNotice.style.display = 'block';
            } catch(e) {
                batchStatusText.innerText = `ZIP生成失败: ${e.message}`;
                console.error(e);
            }
        } else if (mode === 'single') {
            batchStatusText.innerText = `✅ 已触发 ${totalRolesSuccess} 次下载，如果部分被浏览器拦截，请允许此页面的多个下载权限。`;
        }
        
        setTimeout(() => {
            batchProgressArea.style.display = 'none';
            batchZipDirectBtn.disabled = false;
            batchSingleDirectBtn.disabled = false;
        }, 3000);
    }

    async function buildRoleGrid() {
        if (!originalImage) return;
        const cols = parseInt(colsInput.value,10), rows = parseInt(rowsInput.value,10), frameW = parseInt(frameWInput.value,10), frameH = parseInt(frameHInput.value,10), colsPerRole = parseInt(colsPerRoleInput.value,10), rowsPerRole = parseInt(rowsPerRoleInput.value,10);
        if (isNaN(cols+rows+frameW+frameH+colsPerRole+rowsPerRole)) return;
        const allFrames = extractFramesFromImage(originalImage, cols, rows, frameW, frameH);
        if (allFrames.length === 0) { roleGridContainer.innerHTML = '<p>无法切割帧</p>'; return; }
        const roleCols = Math.floor(cols / colsPerRole), roleRows = Math.floor(rows / rowsPerRole);
        if (roleCols === 0 || roleRows === 0) { roleGridContainer.innerHTML = `<p>无完整角色</p>`; return; }
        let html = `<div class="role-grid" style="grid-template-columns: repeat(${roleCols}, minmax(70px, 90px));">`;
        for (let r = 0; r < roleRows; r++) {
            for (let c = 0; c < roleCols; c++) {
                let sampleFrame = null;
                for (let fr=0; fr<rowsPerRole && !sampleFrame; fr++)
                    for (let fc=0; fc<colsPerRole && !sampleFrame; fc++) {
                        const idx = ((r*rowsPerRole)+fr)*cols + ((c*colsPerRole)+fc);
                        if (idx < allFrames.length) sampleFrame = allFrames[idx];
                    }
                if (!sampleFrame) continue;
                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = frameW; thumbCanvas.height = frameH;
                thumbCanvas.getContext('2d').drawImage(sampleFrame.canvas,0,0);
                const dataURL = thumbCanvas.toDataURL();
                const isSelected = (parseInt(roleColOffsetInput.value)===c && parseInt(roleRowOffsetInput.value)===r);
                html += `<div class="role-cell ${isSelected ? 'selected' : ''}" data-col="${c}" data-row="${r}"><img src="${dataURL}" width="${frameW}" height="${frameH}" style="image-rendering: crisp-edges;"><div class="role-label">(${c}, ${r})</div></div>`;
            }
        }
        html += `</div><p style="font-size:0.7rem;">点击选择角色</p>`;
        roleGridContainer.innerHTML = html;
        document.querySelectorAll('.role-cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const col = parseInt(cell.dataset.col), row = parseInt(cell.dataset.row);
                roleColOffsetInput.value = col; roleRowOffsetInput.value = row;
                document.querySelectorAll('.role-cell').forEach(el => el.classList.remove('selected'));
                cell.classList.add('selected');
                setStatus(`已选择角色 (${col}, ${row})`);
                if (previewInterval) startPreview();
            });
        });
    }

    function initDirButtons() {
        dirButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const dir = btn.dataset.dir;
                activeDirs[dir] = !activeDirs[dir];
                activeDirs[dir] ? btn.classList.add('active') : btn.classList.remove('active');
                if (previewInterval) startPreview();
            });
        });
    }

    // 拖拽区域独立绑定
    function setupDragZones() {
        singleDropZone.addEventListener('dragover', (e) => { e.preventDefault(); singleDropZone.classList.add('drag-over'); });
        singleDropZone.addEventListener('dragleave', () => { singleDropZone.classList.remove('drag-over'); });
        singleDropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            singleDropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files && files.length) await handleSingleImageDrop(Array.from(files));
        });
        
        batchDropZone.addEventListener('dragover', (e) => { e.preventDefault(); batchDropZone.classList.add('drag-over'); });
        batchDropZone.addEventListener('dragleave', () => { batchDropZone.classList.remove('drag-over'); });
        batchDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            batchDropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files && files.length) addFilesToBatch(Array.from(files));
        });
    }

    function bindEvents() {
        fileInput.addEventListener('change', (e) => { if(e.target.files[0]) handleSingleImageDrop([e.target.files[0]]); });
        batchUploadInput.addEventListener('change', (e) => { if(e.target.files.length) addFilesToBatch(Array.from(e.target.files)); batchUploadInput.value = null; });
        clearAllFilesBtn.addEventListener('click', clearAllFiles);
        
        // 批量直接按钮
        batchZipDirectBtn.addEventListener('click', () => batchProcess('zip'));
        batchSingleDirectBtn.addEventListener('click', () => batchProcess('single'));
        
        previewBtn.addEventListener('click', startPreview);
        stopPreviewBtn.addEventListener('click', () => { stopPreview(); if(originalImage){ const ctx=previewCanvas.getContext('2d'); previewCanvas.width=Math.min(300,originalImage.width); previewCanvas.height=previewCanvas.width*(originalImage.height/originalImage.width); ctx.drawImage(originalImage,0,0,previewCanvas.width,previewCanvas.height); } setStatus('预览停止'); });
        generateAndDownloadBtn.addEventListener('click', generateAndDownloadSingle);
        exportAllRolesZipBtn.addEventListener('click', exportAllRolesAsZip);
        exportAllRolesSingleBtn.addEventListener('click', exportAllRolesAsSingle);
        autoDetectCheck.addEventListener('change', () => { if(originalImage && autoDetectCheck.checked){ const {cols,rows,colsPerRole,rowsPerRole}=detectGridFromFilename(currentFileName); colsInput.value=cols; rowsInput.value=rows; colsPerRoleInput.value=colsPerRole; rowsPerRoleInput.value=rowsPerRole; buildRoleGrid(); } });
        applyOffsetBtn.addEventListener('click', () => { if(originalImage){ if(previewInterval) startPreview(); buildRoleGrid(); } });
        [colsInput, rowsInput, frameWInput, frameHInput, colsPerRoleInput, rowsPerRoleInput].forEach(inp => inp.addEventListener('change', () => buildRoleGrid()));
        closeNoticeBtn.addEventListener('click', () => { zipNotice.style.display = 'none'; });
        initDirButtons();
    }

    renderBatchFileList();
    bindEvents();
    setupDragZones();
    setStatus('✅ 就绪。支持拖拽文件到 左侧 或 下方 窗口上传。');
</script>
